<!doctype html>
<!--
  Capa que aparece quando o link do site é compartilhado no WhatsApp.
  Para gerar a imagem: sirva a pasta do projeto (npx http-server . -p 8082),
  abra http://127.0.0.1:8082/ferramentas/capa-whatsapp.html em uma janela
  de 1200 x 630 e salve a foto da tela em docs/assets/img/capa.png.
-->
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Capa do WhatsApp</title>
<style>
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("../docs/assets/fontes/atkinson-hyperlegible-400.woff2") format("woff2"); font-weight: 400; }

  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    background: #0F4C5C; color: #FFFFFF;
    padding: 64px 76px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: "Atkinson Hyperlegible", sans-serif;
  }
  .marca { display: flex; align-items: center; gap: 16px; font: 700 34px/1 "Barlow Semi Condensed", sans-serif; }
  .marca svg { width: 56px; height: 56px; }
  h1 { font: 700 118px/0.96 "Barlow Semi Condensed", sans-serif; margin: 0; }
  h1 span { color: #F2B705; display: block; }
  .base { display: flex; align-items: end; justify-content: space-between; gap: 48px; }
  p { margin: 0; font-size: 30px; line-height: 1.3; color: #C9DDE1; white-space: nowrap; }
  .trajeto { width: 360px; height: auto; flex: none; }
</style></head>
<body>
  <div class="marca">

      <path d="M58 46h118M240 46h118" stroke-width="6"/>
